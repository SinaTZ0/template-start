# The deploy menu's tmux server (docs/deployment.md → Closing the SSH connection). deploy/deploy.sh starts it on its
# own socket (`tmux -L deploy`) with this file, so none of it touches the operator's own tmux, and theirs doesn't
# touch it.

# A build prints thousands of lines; tmux's default of 2000 loses the start of it. Each action's whole output is in
# deploy/logs/ as well.
set -g history-limit 100000

# The mouse wheel scrolls back (tmux's copy mode, which ends at the bottom or with q). Dragging selects and copies to
# the computer's clipboard where the terminal allows it (OSC 52; Windows Terminal, iTerm2, kitty…); holding Shift
# while dragging uses the terminal's own selection instead.
set -g mouse on

set -g status-left-length 20
set -g status-left " Deploy "
set -g status-right-length 80
set -g status-right " Wheel: scroll back · Ctrl-b d: leave it running · Quit: close "

# Someone attached: the menu checks its status again, which otherwise shows how things were when it was drawn
# (commits pushed since, a backup that ran). SIGUSR1 to the deploy tool the window runs; the tool takes the signal
# whatever it's doing, and only the menu acts on it.
set-hook -g client-attached 'run-shell -b "pkill -USR1 -x deploy -P #{pane_pid} || true"'
