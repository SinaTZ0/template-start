# Development services only: Postgres, SeaweedFS (S3-compatible image storage, docs/backend/media.md) and Bugsink (error
# tracker, docs/backend/logging.md). The app itself runs on the host with `pnpm dev`. Start with `pnpm services`, which also creates the media bucket
# (`deploy/init-storage.mjs`); the values match `.env.example`.

# Pinned so the volumes keep their names even when the folder is renamed. Rename per project.
name: template-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3 without authentication: fine on a development machine, never in production (`compose.prod.yaml` adds identities).
  # Each bucket claims several volumes up front, and the volume count is derived from free disk / volume size. With the
  # default 30 GB volumes a laptop runs out after two or three buckets ("No writable volumes"), so volumes stay small.
  seaweedfs:
    image: chrislusf/seaweedfs:3.99
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs:/data

  # Error tracker at http://localhost:8000 (sign in as admin@example.com / admin). Create a project there and put its DSN
  # in `.env` as `SENTRY_DSN`. Bugsink advises against SQLite on a Docker volume, so it gets its own small Postgres.
  bugsink:
    image: bugsink/bugsink:2
    environment:
      SECRET_KEY: development-only-secret-key-that-is-at-least-fifty-characters-long
      CREATE_SUPERUSER: admin@example.com:admin
      PORT: 8000
      BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://bugsink:bugsink@bugsink-db:5432/bugsink
    ports:
      - "8000:8000"
    depends_on:
      bugsink-db:
        condition: service_healthy

  bugsink-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bugsink
      POSTGRES_PASSWORD: bugsink
      POSTGRES_DB: bugsink
    volumes:
      - bugsink-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsink -d bugsink"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  seaweedfs:
  bugsink-pgdata:
