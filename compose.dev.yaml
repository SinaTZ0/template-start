# Development services only: Postgres and SeaweedFS (S3-compatible image storage, docs/backend/media.md). The app runs
# on the host with `pnpm dev`, and the error viewer (tools/error-viewer, docs/backend/logging.md) with `pnpm errors`.
# Start with `pnpm services`, which also creates the media bucket (`deploy/init-storage.mjs`); the values match
# `.env.example`.

# Pinned so the volumes keep their names even when the folder is renamed. Rename per project.
name: template-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3 without authentication: fine on a development machine, never in production (`compose.prod.yaml` adds identities).
  # Each bucket claims several volumes up front, and the volume count is derived from free disk / volume size. With the
  # default 30 GB volumes a laptop runs out after two or three buckets ("No writable volumes"), so volumes stay small.
  seaweedfs:
    image: chrislusf/seaweedfs:3.99
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs:/data

volumes:
  pgdata:
  seaweedfs:
