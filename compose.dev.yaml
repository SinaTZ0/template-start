# Development services only: Postgres, SeaweedFS (S3-compatible image storage, docs/backend/media.md) and the error
# viewer (tools/error-viewer, docs/backend/logging.md). The app itself runs on the host with `pnpm dev`. Start with `pnpm services`, which also creates the media bucket
# (`deploy/init-storage.mjs`); the values match `.env.example`.

# Pinned so the volumes keep their names even when the folder is renamed. Rename per project.
name: template-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3 without authentication: fine on a development machine, never in production (`compose.prod.yaml` adds identities).
  # Each bucket claims several volumes up front, and the volume count is derived from free disk / volume size. With the
  # default 30 GB volumes a laptop runs out after two or three buckets ("No writable volumes"), so volumes stay small.
  seaweedfs:
    image: chrislusf/seaweedfs:3.99
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs:/data

  # Error viewer at http://localhost:8000 (password `admin`), built from tools/error-viewer. The key is fixed, so the DSN
  # in `.env.example` works as is: http://developmentkey@localhost:8000/1.
  error-viewer:
    build:
      context: tools/error-viewer
      # A Go module mirror, if proxy.golang.org is out of reach (tools/error-viewer/README.md). Read from `.env`.
      args:
        GOPROXY: ${GOPROXY:-}
    environment:
      PUBLIC_KEY: developmentkey
      ADMIN_PASSWORD: admin
      SESSION_SECRET: development-only-session-secret-at-least-32-characters
      # The app's pages send browser errors here: `pnpm dev` and `pnpm start`.
      ALLOWED_ORIGIN: http://localhost:5173,http://localhost:3000
      BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - error-viewer-data:/data

volumes:
  pgdata:
  seaweedfs:
  error-viewer-data:
