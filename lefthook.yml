# Git hooks, installed by `pnpm install` (the `prepare` script). Skip once with `git commit --no-verify`.

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,mjs,cjs,jsx,ts,tsx}"
      # The untouched shadcn source, the design references and the agent skills are reference only and aren't linted
      # (`.oxlintrc.json`).
      exclude:
        - "src/components/ui/**"
        - ".agents/**"
        - ".claude/**"
        - "docs/frontend/reference/**"
      run: pnpm exec oxlint {staged_files}
    - name: format
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      # Re-stages what Prettier changed, so the commit holds the formatted files.
      stage_fixed: true
    - name: deploy-binary
      # The deploy tool is committed as a binary (docs/deployment.md → The Deploy Tool): a source change needs it rebuilt.
      glob: "tools/deploy/**"
      run: bash tools/deploy/build.sh --check

# Conventional Commits (`feat: …`, `fix(scope): …`), checked by commitlint (`commitlint.config.js`).
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
    # A commit that changes the server's seed data needs a deploy step, or `Deploy-Step: none` in its message
    # (deploy/steps/README.md). Here and not in pre-commit, because it reads the message.
    - name: deploy-steps
      run: bash scripts/check-deploy-steps.sh {1}
